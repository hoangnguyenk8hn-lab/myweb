name: Apply latest source once

on:
  push:
    branches:
      - update-latest-source

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: update-latest-source
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Apply source changes
        run: python3 scripts/apply-latest-source-once.py

      - name: Install dependencies
        run: npm ci

      - name: Run geometry and interaction tests
        run: node --test tests/selection-geometry.test.cjs tests/drawing-interactions.test.cjs

      - name: Verify production build
        run: npx next build

      - name: Commit verified source update
        run: |
          rm -f scripts/apply-latest-source-once.py
          rm -f .github/workflows/apply-latest-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge latest Diagram Draw source while preserving Option/Alt behavior"
          git push origin HEAD:update-latest-source
